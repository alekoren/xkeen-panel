name: Mihomo panel preview

on:
  push:
    branches: [feature/mihomo-panel]
    paths-ignore: ['ci-reports/**']

permissions:
  contents: write

concurrency:
  group: mihomo-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      - name: Install frontend dependencies
        id: npm
        continue-on-error: true
        run: |
          cd frontend
          npm ci 2>&1 | tee "$RUNNER_TEMP/npm.log"
      - name: Build frontend
        id: frontend
        if: steps.npm.outcome == 'success'
        continue-on-error: true
        run: |
          cd frontend
          npm run build 2>&1 | tee "$RUNNER_TEMP/frontend.log"
      - name: Test Go
        id: tests
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        run: go test ./... 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Build Linux ARM64 preview
        id: binary
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags='-s -w -X xkeen-panel/internal/version.Version=dev-mihomo-preview' -o build/xkeen-panel-aarch64 . 2>&1 | tee "$RUNNER_TEMP/binary.log"
          (cd build && sha256sum xkeen-panel-aarch64 > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: steps.binary.outcome == 'success'
        with:
          name: xkeen-panel-arm64-preview
          path: |
            build/xkeen-panel-aarch64
            build/SHA256SUMS
          if-no-files-found: error
      - name: Save diagnostic report in feature branch
        if: always()
        uses: actions/github-script@v7
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(process.env.STEP_RESULTS);
            let report = '# Mihomo preview build report\n\n';
            report += `Source commit: ${context.sha}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            for (const id of ['go', 'node', 'npm', 'frontend', 'tests', 'binary']) {
              report += `## ${id}: ${results[id]?.outcome || 'not run'}\n\n`;
              const file = `${process.env.RUNNER_TEMP}/${id}.log`;
              if (fs.existsSync(file)) {
                const text = fs.readFileSync(file, 'utf8').split('\n').slice(-100).join('\n').slice(-16000);
                report += '~~~~text\n' + text + '\n~~~~\n\n';
              }
            }
            const path = 'ci-reports/mihomo-preview.md';
            const branch = 'feature/mihomo-panel';
            let sha;
            try {
              const previous = await github.rest.repos.getContent({...context.repo, path, ref: branch});
              sha = previous.data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, path, branch, sha, message: 'Save preview build diagnostics [skip ci]', content: Buffer.from(report).toString('base64')});
      - name: Enforce successful build
        if: always()
        env:
          BUILD_RESULT: ${{ steps.binary.outcome }}
        run: test "$BUILD_RESULT" = success
