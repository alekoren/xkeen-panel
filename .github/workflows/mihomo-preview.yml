name: Mihomo panel preview

on:
  push:
    branches: [feature/mihomo-panel]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make build-frontend
      - run: go test ./...
      - name: Build Linux ARM64 preview
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags='-s -w -X xkeen-panel/internal/version.Version=dev-mihomo-preview' -o build/xkeen-panel-aarch64 .
          (cd build && sha256sum xkeen-panel-aarch64 > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: xkeen-panel-arm64-preview
          path: |
            build/xkeen-panel-aarch64
            build/SHA256SUMS
          if-no-files-found: error
